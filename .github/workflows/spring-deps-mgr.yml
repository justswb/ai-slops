name: Spring Dependencies Manager Release

# Every push to main that touches this project's code builds and tests spring-deps-mgr.exe, then tags the next
# patch version (v2.0.0 -> v2.0.1) and publishes it as a GitHub release.
# "Run workflow" does the same with a chosen bump (patch, minor or major).
# Tags use spring-deps-mgr/vX.Y.Z; pushing one releases that exact version.
# Path filters only apply to branch pushes.
# Dry run: pushes to any other branch, or "Run workflow" with dry run ticked, do everything except
# publishing; they report the version they would release and keep the exe as a workflow artifact.
on:
  push:
    branches: ['**']
    tags: ['spring-deps-mgr/v*']
    paths:
      - 'spring-deps-mgr/**.go'
      - 'spring-deps-mgr/go.mod'
      - 'spring-deps-mgr/go.sum'
      - 'spring-deps-mgr/testdata/**'
      - 'spring-deps-mgr/package.ps1'
      - '.github/workflows/spring-deps-mgr.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increase
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: Dry run (build, test and pick the version, but do not tag or release)
        type: boolean
        default: false

permissions:
  contents: write

# Run releases one at a time so two pushes never compute the same next version; dry runs on other
# branches get their own group.
concurrency:
  group: spring-deps-mgr-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/spring-deps-mgr/v')) && 'release' || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: spring-deps-mgr
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags, to find the latest version

      - uses: actions/setup-go@v7
        with:
          go-version-file: spring-deps-mgr/go.mod
          cache-dependency-path: spring-deps-mgr/go.sum

      - name: Pick version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          PUBLISH: ${{ !inputs.dry_run && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/spring-deps-mgr/v')) }}
        run: |
          prefix=spring-deps-mgr/
          # Only this project's vX.Y.Z tags count; ignore other projects and pre-releases.
          # (grep exits 1 when nothing matches, which would fail the step under bash -e -o pipefail.)
          versions() { git tag "$@" --sort=-v:refname | { grep -E '^spring-deps-mgr/v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | head -n1; }
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [[ ! "$GITHUB_REF_NAME" =~ ^spring-deps-mgr/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a spring-deps-mgr/vX.Y.Z tag' >&2
            exit 1
          fi
          # Reuse a version tag already on this commit (manual tag push, or a re-run).
          tag=$(versions --points-at HEAD)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag=$GITHUB_REF_NAME; fi
          version=${tag#"$prefix"}
          if [ -z "$tag" ]; then
            latest=$(versions)
            if [ -z "$latest" ]; then
              # First release: v0.1.0 (or v1.0.0 when a major bump is asked for).
              [ "$BUMP" = major ] && version=v1.0.0 || version=v0.1.0
            else
              latest=${latest#"$prefix"}
              IFS=. read -r major minor patch <<< "${latest#v}"
              case "$BUMP" in
                major) version="v$((major + 1)).0.0" ;;
                minor) version="v${major}.$((minor + 1)).0" ;;
                *)     version="v${major}.${minor}.$((patch + 1))" ;;
              esac
            fi
            tag="${prefix}${version}"
          fi
          if [ "$PUBLISH" = true ]; then msg="Releasing $tag"; else msg="Dry run: would release $tag (bump: $BUMP)"; fi
          echo "$msg"
          echo "### $msg" >> "$GITHUB_STEP_SUMMARY"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Build spring-deps-mgr.exe
        run: ./package.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Test spring-deps-mgr.exe
        run: go test -v ./...

      - name: Vet
        run: go vet ./...

      - name: Verify binary version
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $actual = & ./dist/spring-deps-mgr.exe --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_VERSION) { throw "Binary version mismatch: $actual" }

      - name: Keep exe as workflow artifact (dry run)
        if: steps.version.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: spring-deps-mgr-${{ steps.version.outputs.version }}-dry-run
          path: |
            spring-deps-mgr/dist/spring-deps-mgr.exe
            spring-deps-mgr/dist/SHA256SUMS

      # Creates the tag on this commit (if new) and the release, with the exe attached.
      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            spring-deps-mgr/dist/spring-deps-mgr.exe
            spring-deps-mgr/dist/SHA256SUMS
