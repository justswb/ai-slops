name: Spring Initializr CLI Release

# Every push to main that touches this project's code builds and tests spring-init.exe, then tags the next
# patch version (v2.0.0 -> v2.0.1) and publishes it as a GitHub release.
# "Run workflow" does the same with a chosen bump (patch, minor or major).
# Tag pushes do not trigger this workflow; path filters only apply to branch pushes.
# Dry run: pushes to any other branch, or "Run workflow" with dry run ticked, do everything except
# publishing; they report the version they would release and keep the exe as a workflow artifact.
on:
  push:
    branches: ['**']
    paths:
      - 'spring-initializr-cli/**.go'
      - 'spring-initializr-cli/go.mod'
      - 'spring-initializr-cli/go.sum'
      - 'spring-initializr-cli/testdata/**'
      - 'spring-initializr-cli/install.ps1'
      - 'spring-initializr-cli/install_test.ps1'
      - '.github/workflows/spring-initializr-cli-release.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increase
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: Dry run (build, test and pick the version, but do not tag or release)
        type: boolean
        default: false

permissions:
  contents: write

# Run releases one at a time so two pushes never compute the same next version; dry runs on other
# branches get their own group.
concurrency:
  group: spring-initializr-cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: spring-initializr-cli
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags, to find the latest version

      - uses: actions/setup-go@v7
        with:
          go-version-file: spring-initializr-cli/go.mod
          cache-dependency-path: spring-initializr-cli/go.sum

      - name: Pick version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          PUBLISH: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
        run: |
          # Only plain vX.Y.Z tags count as versions (pre-releases like v2.1.0-rc1 are ignored).
          # (grep exits 1 when nothing matches, which would fail the step under bash -e -o pipefail.)
          versions() { git tag "$@" --sort=-v:refname | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | head -n1; }
          # Reuse a version tag already on this commit (manual tag push, or a re-run).
          tag=$(versions --points-at HEAD)
          if [ -z "$tag" ]; then
            latest=$(versions)
            if [ -z "$latest" ]; then
              # First release: v0.1.0 (or v1.0.0 when a major bump is asked for).
              [ "$BUMP" = major ] && tag=v1.0.0 || tag=v0.1.0
            else
              IFS=. read -r major minor patch <<< "${latest#v}"
              case "$BUMP" in
                major) tag="v$((major + 1)).0.0" ;;
                minor) tag="v${major}.$((minor + 1)).0" ;;
                *)     tag="v${major}.${minor}.$((patch + 1))" ;;
              esac
            fi
          fi
          if [ "$PUBLISH" = true ]; then msg="Releasing $tag"; else msg="Dry run: would release $tag (bump: $BUMP)"; fi
          echo "$msg"
          echo "### $msg" >> "$GITHUB_STEP_SUMMARY"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Build spring-init.exe
        run: go build -trimpath -ldflags="-s -w -X main.version=${{ steps.version.outputs.tag }}" -o dist/spring-init.exe .

      - name: Test spring-init.exe
        run: go test -v ./...
        env:
          SPRING_INIT_BIN: dist/spring-init.exe

      # Installs the built exe with install.ps1 on the runner, then updates and uninstalls it, checking
      # the user PATH each time.
      - name: Test install script
        run: ./install_test.ps1 -Exe dist/spring-init.exe -ExpectedVersion ${{ steps.version.outputs.tag }}

      - name: Keep exe as workflow artifact (dry run)
        if: steps.version.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: spring-init-${{ steps.version.outputs.tag }}-dry-run
          path: spring-initializr-cli/dist/spring-init.exe

      # Creates the tag on this commit (if new) and the release, with the exe attached.
      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: spring-initializr-cli/dist/spring-init.exe
